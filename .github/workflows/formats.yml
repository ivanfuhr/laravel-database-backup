name: Formats

on: ['push', 'pull_request']

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    name: Formats P8.4

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, zip, fileinfo, pdo, pdo_pgsql
          coverage: none

      - name: Install Composer dependencies
        run: composer update --prefer-stable --no-interaction --prefer-dist

      - name: Quality Checks
        run: |
          composer test:refactor
          composer test:lint
          composer test:types
